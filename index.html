<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DOM API</title>
        <link rel="stylesheet" href="./assets/styles/main.css" />
        <script src="assets/scripts/main.js" type="module" defer></script>
    </head>
    <body>
        <article class="user-card" data-js-user-card>
            <h2 class="user-card__nickname">Nicky</h2>
            <img
                src="./assets/images/avatar.png"
                alt="avatar"
                class="user-card__avatar"
            />
            <div class="user-card__body">
                <div class="user-card__header">
                    <div class="user-card__identity">
                        <p class="user-card__identity-name">Mark Snow</p>
                        <p class="user-card__identity-occupation">
                            Photographer
                        </p>
                    </div>
                    <button class="user-card__like button" data-js-like-btn>
                        <svg
                            width="16px"
                            height="16px"
                            viewBox="0 0 12 12"
                            enable-background="new 0 0 12 12"
                            id="Слой_1"
                            version="1.1"
                            xml:space="preserve"
                            xmlns="http://www.w3.org/2000/svg"
                            xmlns:xlink="http://www.w3.org/1999/xlink"
                        >
                            <path
                                d="M8.5,1C7.5206299,1,6.6352539,1.4022217,6,2.0504761C5.3648071,1.4022827,4.4793701,1,3.5,1  C1.5670166,1,0,2.5670166,0,4.5S2,8,6,11c4-3,6-4.5670166,6-6.5S10.4329834,1,8.5,1z"
                                fill="currentColor"
                            />
                        </svg>
                    </button>
                </div>
                <div class="user-card__info">
                    <p class="user-card__info-birthday">10.05.1999</p>
                    <p class="user-card__info-description">
                        Capture beautiful moments
                    </p>
                </div>
                <div class="user-card__contacts contacts">
                    <a
                        href="mailto:photocreator@gmail.com"
                        class="contacts__email"
                        >photocreator@gmail.com</a
                    >
                    <a href="tel:+380630311331" class="contacts__tel"
                        >+38(063)-031-13-31</a
                    >
                </div>
                <div class="user-card__profile">
                    <a
                        href=""
                        class="user-card__projects button"
                        data-js-projects-btn
                        ><svg
                            fill="#000000"
                            width="16px"
                            height="16px"
                            viewBox="0 0 20 20"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <g>
                                <path
                                    d="M2,9H9V2H2ZM4,4H7V7H4Zm7-2V9h7V2Zm5,5H13V4h3ZM2,18H9V11H2Zm2-5H7v3H4Zm7,5h7V11H11Zm2-5h3v3H13Z"
                                />
                            </g>
                        </svg>
                    </a>
                    <button
                        href=""
                        class="user-card__follow button button--light"
                        data-js-subscribe-btn
                    >
                        <span data-js-subscribe-text>Follow</span>
                        <svg
                            class="plus-icon"
                            width="16px"
                            height="16px"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            data-js-subscribe-icon
                        >
                            <path
                                d="M4 12H20M12 4V20"
                                stroke="#000000"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <svg
                            class="check-mark-icon visually-hidden"
                            fill="#000000"
                            width="16px"
                            height="16px"
                            viewBox="0 0 1920 1920"
                            xmlns="http://www.w3.org/2000/svg"
                            data-js-subscribe-icon
                        >
                            <path
                                d="M1827.701 303.065 698.835 1431.801 92.299 825.266 0 917.564 698.835 1616.4 1919.869 395.234z"
                                fill-rule="evenodd"
                            />
                        </svg>
                    </button>
                </div>
            </div>
        </article>
    </body>
</html>
